name: Deploy Notebook

on:
  push:
    branches:
      - main
      - dev
  repository_dispatch:
    types: [trigger-build-dev, trigger-build-latest]


permissions:
  contents: write # Required to create releases
  actions: write # Required to access actions
  packages: write # Required to push Docker images

jobs:
  call-parent-build:
    uses: msd-live/build-jupyter-notebook/.github/workflows/notebook-image-build.yml@main
  
